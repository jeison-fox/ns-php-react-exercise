name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job 1: Backend Linting
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHP_CodeSniffer
        run: composer run cs

      - name: Run PHPStan
        run: composer run stan

  # Job 2: Frontend Linting
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # Job 3: Integration & E2E Tests
  integration-tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.test.yml up -d --build

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to be healthy..."
          timeout 120 bash -c 'until curl -s http://localhost:18000/health > /dev/null 2>&1; do sleep 2; echo "Waiting..."; done'
          echo "Backend is ready!"

      - name: Seed database
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.test.yml exec -T backend ./seed.sh

      - name: Run backend tests (PHPUnit)
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.test.yml exec -T backend ./tests.sh

      - name: Re-seed database for E2E tests
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.test.yml exec -T backend ./seed.sh

      - name: Run frontend E2E tests (Playwright)
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.test.yml exec -T frontend ./tests.sh

      - name: Print logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.test.yml logs backend
          echo ""
          echo "=== Frontend Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.test.yml logs frontend
          echo ""
          echo "=== Database Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.test.yml logs db

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.test.yml down -v
